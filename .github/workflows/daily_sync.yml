name: Sync Comprobantes ARCA

on:
  schedule:
    # Corrida principal: ~8am Argentina nominal (11:00 UTC). Por la demora
    # habitual de GitHub Actions suele caer alrededor de las 10hs ART.
    - cron: "0 11 * * *"
    # Reintento: nominal 13hs ART (16:00 UTC). Con la demora habitual cae
    # ~14-16hs ART. SOLO corre si la corrida anterior terminó en error.
    - cron: "0 16 * * *"
  workflow_dispatch:
    # Permite correrlo manualmente desde la pestaña Actions de GitHub
    inputs:
      prueba_alerta:
        description: "Enviar SOLO un mail de prueba de la alerta (no corre el sync)"
        type: boolean
        default: false

permissions:
  contents: read
  actions: read            # necesario para leer el resultado de la corrida anterior

jobs:
  decidir:
    runs-on: ubuntu-latest
    outputs:
      correr: ${{ steps.d.outputs.correr }}
      solo_cuits: ${{ steps.d.outputs.solo_cuits }}
    steps:
      - name: ¿Corresponde correr? ¿Reintento dirigido?
        id: d
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Manual o corrida de la mañana: siempre corre, y COMPLETO (sin filtro)
          if [ "${{ github.event_name }}" != "schedule" ] || [ "${{ github.event.schedule }}" = "0 11 * * *" ]; then
            echo "correr=true" >> "$GITHUB_OUTPUT"
            echo "solo_cuits=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Reintento de la tarde: solo si la última corrida terminó en error
          read -r ultima_id ultima_concl < <(gh run list --workflow daily_sync.yml -R "$GITHUB_REPOSITORY" \
            --limit 10 --json databaseId,status,conclusion \
            --jq 'map(select(.status=="completed")) | .[0] | "\(.databaseId) \(.conclusion)"')
          echo "Última corrida $ultima_id terminó en: $ultima_concl"
          if [ "$ultima_concl" != "failure" ]; then
            echo "correr=false" >> "$GITHUB_OUTPUT"
            echo "solo_cuits=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "correr=true" >> "$GITHUB_OUTPUT"
          # Bajar el artifact con los CUIT que fallaron a la mañana y armar la
          # lista para reintentar SOLO esos. Si no se puede leer, se deja vacío:
          # el sync entonces corre COMPLETO (misma red de seguridad de antes).
          cuits=""
          if gh run download "$ultima_id" -R "$GITHUB_REPOSITORY" -n fallidos -D _fallidos 2>/dev/null; then
            cuits=$(jq -r 'join(",")' _fallidos/fallidos.json 2>/dev/null || echo "")
          fi
          echo "CUIT a reintentar: '${cuits}'"
          echo "solo_cuits=${cuits}" >> "$GITHUB_OUTPUT"

  sync:
    needs: decidir
    if: needs.decidir.outputs.correr == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install requests gspread google-auth

      - name: Ejecutar sincronización
        env:
          AFIPSDK_TOKEN: ${{ secrets.AFIPSDK_TOKEN }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          CLIENTS_JSON: ${{ secrets.CLIENTS_JSON }}
          DAYS_BACK: ${{ secrets.DAYS_BACK }}
          # Alerta por mail (Resend) SOLO en el reintento de la tarde: si un
          # cliente falla los dos intentos del día, avisa. Blip que se arregla
          # a la tarde → no molesta.
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          MAIL_TO: pomodoroconsulting@gmail.com
          ES_REINTENTO: ${{ github.event_name == 'schedule' && github.event.schedule == '0 16 * * *' }}
          PRUEBA_ALERTA: ${{ inputs.prueba_alerta }}
          # Reintento dirigido: CUIT que fallaron a la mañana (vacío = corre todo).
          SOLO_CUITS: ${{ needs.decidir.outputs.solo_cuits }}
          # Al terminar, el bot dispara el import de la app (así la app corre
          # SIEMPRE después del bot, con la Sheet ya actualizada).
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: python sync_comprobantes.py

      - name: Guardar CUIT fallidos (para el reintento dirigido)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fallidos
          path: fallidos.json
          if-no-files-found: ignore
          retention-days: 2
          overwrite: true
