name: Sync Comprobantes ARCA

on:
  schedule:
    - cron: "0 11 */3 * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install requests gspread google-auth

      - name: Ejecutar sincronización
        env:
          AFIPSDK_TOKEN: ${{ secrets.AFIPSDK_TOKEN }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID_TEST }}
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          CLIENTS_JSON: ${{ secrets.CLIENTS_JSON }}
          DAYS_BACK: ${{ secrets.DAYS_BACK }}
        run: python sync_comprobantes.py
